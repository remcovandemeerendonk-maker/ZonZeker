name: Publiceer op GitHub Pages

# Publiceert bij elke push naar de standaardbranch, of handmatig via "Run workflow".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit-tests
        run: npm test
      - name: Site samenstellen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest icon.svg icon-180.png icon-512.png css js _site/
          # Versienummer in de bestandsnamen, zodat browsers na een update geen oude scripts gebruiken.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
          sed -i "s/__VERSIE__/$(TZ=Europe/Amsterdam date '+%-d-%-m-%Y %H:%M') (${GITHUB_SHA::7})/" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
